<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Forecast — Product</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">Price<span>Forecast</span></a>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loading-text">Loading forecast...</p>
        </div>

        <div id="error" class="error-banner hidden"></div>

        <section id="product-content" class="hidden">
            <div class="product-header">
                <h1 id="product-name"></h1>
                <button id="retrain-btn" class="btn-secondary">Retrain Models</button>
            </div>

            <div id="dip-alert" class="dip-alert hidden">
                <strong>Predicted next dip:</strong>
                <span id="dip-date"></span> at <span id="dip-price"></span>
            </div>

            <div id="no-dip" class="info-banner hidden">
                No significant price dip predicted in the next 30 days.
            </div>

            <div class="chart-container">
                <canvas id="price-chart"></canvas>
            </div>

            <section class="model-comparison">
                <h2>Model Comparison</h2>
                <p class="section-desc">All models trained on the same train/test split. Lower is better.</p>
                <table id="comparison-table">
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>MAE</th>
                            <th>MAPE (%)</th>
                            <th>RMSE</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p><a href="/">← Back to search</a></p>
        </div>
    </footer>

    <script>
        const PRODUCT_ID = {{ product_id }};
    </script>
    <script src="/static/js/product.js"></script>
</body>
</html>
