services:
  api:
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app
      - temperature_models:/app/model_artifacts

  worker:
    volumes:
      - ./backend:/app
      - temperature_models:/app/model_artifacts

  scheduler:
    volumes:
      - ./backend:/app

  frontend:
    build:
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - temperature_frontend_modules:/app/node_modules

volumes:
  temperature_frontend_modules:
