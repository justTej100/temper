services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: forecast
      POSTGRES_DB: forecast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    volumes:
      - .:/app
      - model_artifacts:/app/model_artifacts
    ports:
      - "8000:8000"
    environment: &app_env
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DATABASE_URL: ${DATABASE_URL:-postgres://forecast:forecast@db:5432/forecast}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_STORAGE_BACKEND: ${MODEL_STORAGE_BACKEND:-local}
      MODEL_STORAGE_PATH: ${MODEL_STORAGE_PATH:-/app/model_artifacts}
      MODEL_CACHE_TTL_HOURS: ${MODEL_CACHE_TTL_HOURS:-24}
      DATA_SOURCE: ${DATA_SOURCE:-demo}
      KEEPA_API_KEY: ${KEEPA_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - frontend/
            - .git/
            - .venv/
            - **/__pycache__/
            - **/node_modules/
            - model_artifacts/
            - staticfiles/
            - .next/
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker:
    build: .
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - .:/app
      - model_artifacts:/app/model_artifacts
    environment:
      <<: *app_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - frontend/
            - .git/
            - .venv/
            - **/__pycache__/
            - **/node_modules/
            - model_artifacts/
            - staticfiles/
            - .next/
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - web
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  postgres_data:
  mlflow_data:
  model_artifacts:
  frontend_node_modules:
